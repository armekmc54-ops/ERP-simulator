name: Neo4j Tutorial Pipeline CI

on:
  push:
    branches: ['175932', 'development', 'main']
    paths: ['tutorial_175932/**', 'erp_ap/**', 'ingest_football_data.py', 'neo4j.py', 'examples/**', '.github/workflows/neo4j-ci.yml']
  pull_request:
    paths: ['tutorial_175932/**', 'erp_ap/**', 'ingest_football_data.py', 'neo4j.py', 'examples/**', '.github/workflows/neo4j-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s erp_ap -p test_rules.py
      - run: python -m py_compile erp_ap/*.py tutorial_175932/*.py ingest_football_data.py examples/neo4j_demo.py
      - name: Reject local module shadowing
        run: test ! -f neo4j.py
  run-neo4j-tutorial:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/tutorial175932
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_server_memory_pagecache_size: 512m
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p tutorial175932 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: tutorial175932
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tutorial dependencies
        run: pip install -r tutorial_175932/requirements.txt
      - name: Check syntax
        run: python -m py_compile tutorial_175932/*.py
      - name: Run tutorial and capture evidence
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tutorial_175932/evidence
          python -u tutorial_175932/run_tutorial.py 2>&1 | tee tutorial_175932/evidence/execution.log
      - name: Verify official driver import from repository root
        run: python -c "from neo4j import GraphDatabase; print(GraphDatabase.__module__)"
      - name: Load and validate ERP AP graph
        shell: bash
        run: |
          set -o pipefail
          mkdir -p erp_ap/evidence
          python -u erp_ap/run_graph.py 2>&1 | tee erp_ap/evidence/execution.log
      - name: Upload real execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo4j-and-erp-ap-evidence
          path: |
            tutorial_175932/evidence/
            erp_ap/evidence/
